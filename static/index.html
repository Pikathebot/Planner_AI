<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Agent</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- html2pdf.js for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header id="header">
            <h1>✨ Local AI Planning Agent</h1>
            <p>Intelligent Multi-Model Orchestration &nbsp;•&nbsp; Powered by Ollama</p>
            <div class="header-models">
                llama3.1:8b &nbsp;·&nbsp; qwen2.5-coder:7b &nbsp;·&nbsp; gemma4-e2b-it:latest &nbsp;·&nbsp; llama3.2:latest
            </div>
        </header>

        <!-- Unified Chat & Planning View -->
        <main>
            <div class="chat-layout">
                <!-- Left: Chat Area -->
                <div class="chat-column">
                    <div id="chat-history" class="chatbot">
                        <!-- Chat messages injected here -->
                    </div>

                    <div class="chat-controls">
                        <textarea id="chat-input" rows="2" placeholder="Type a message… (Enter to send)"></textarea>
                        
                        <div class="action-row" style="margin-top: 10px;">
                            <select id="chat-model" class="model-select" style="max-width: 140px;"></select>
                            <select id="chat-search" class="model-select" style="max-width: 110px;" title="Web Search for Plans">
                                <option value="auto">Srch: Auto</option>
                                <option value="on">Srch: ON</option>
                                <option value="off">Srch: OFF</option>
                            </select>
                            <button id="btn-send-chat" class="btn btn-primary" onclick="sendChat()">💬 Send</button>
                            <button id="btn-plan-chat" class="btn btn-secondary" onclick="generateChatPlan()">📋 Plan This</button>
                            <button id="btn-stop-chat" class="btn btn-stop" onclick="stopChat()" disabled>⏹ Stop</button>
                            <button id="btn-clear-chat" class="btn" onclick="clearChat()">🗑 Clear</button>
                        </div>
                    </div>
                </div>

                <!-- Right: Side Panel for Plans -->
                <div class="pinned-plan-column">
                    <div class="section-label">📋 Active Plan</div>
                    
                    <div class="run-info-unified">
                        <span class="info-badge" id="info-task" title="Task Type">🧠 —</span>
                        <span class="info-badge" id="info-model" title="Model">🤖 —</span>
                        <span class="info-badge" id="info-search" title="Search State">🔍 —</span>
                    </div>

                    <div id="chat-plan-output" class="plan-panel">
                        <em>Type a goal into Chat and press <strong>📋 Plan This</strong> to get started.</em>
                    </div>
                    <div class="responsive-row" style="margin-top: 10px;">
                        <button id="btn-download-chat-plan" class="btn row-col" onclick="downloadChatPlan()" style="display:none;">📥 Markdown</button>
                        <button id="btn-download-chat-pdf" class="btn row-col" onclick="downloadChatPlanPDF()" style="display:none; color: #f87171; border-color: rgba(248, 113, 113, 0.3);">📄 PDF</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Main Logic -->
    <script src="/static/app.js"></script>
</body>
</html>
